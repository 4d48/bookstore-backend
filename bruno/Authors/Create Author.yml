info:
  name: Create Author
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/authors"
  body:
    type: json
    data: |-
      {
        "name": "George Orwell",
        "books": [2]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
