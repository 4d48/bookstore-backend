info:
  name: Create Author
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/authors"
  body:
    type: json
    data: |-
      {
        "name": "George Orwell",
        "book_ids": [2,4,3,1]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
