[project]
name = "bookstore-backend"
version = "0.0.0"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.51",
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
extraPaths = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
